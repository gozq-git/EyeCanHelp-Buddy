name: Backend Full CI/CD Pipeline

on:
  workflow_dispatch:
  # Analyse every PR, so the quality gate blocks before a merge rather than after.
  pull_request:
    branches:
      - main
  # Also analyse main itself. SonarCloud's dashboard and its API default to the
  # main branch, so without this the baseline silently goes stale: PR analyses land
  # under their own pull-request id and main keeps reporting its last push-time
  # result. Paths include frontend/** because sonar.sources now covers it too.
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - sonar-project.properties
      - .github/workflows/backend-cicd full.yml

permissions:
  contents: read

jobs:
  backend-tests:
    name: Unit test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          python -m pytest \
            --cov=services --cov=agents --cov=database \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:../reports/backend/coverage \
            --html=../reports/backend/report.html --self-contained-html
      - name: Upload pytest coverage for SonarQube
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-report
          path: reports/backend

  frontend-tests:
    name: Unit test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      # vitest writes `SF:src/...` because its root is frontend/, but the scanner
      # resolves lcov paths from the repo root, where that is nothing. Without this
      # rewrite every frontend file reports 0% coverage even though the report is
      # present. Anchored to line start and guarded so a re-run stays idempotent.
      - name: Make lcov paths repo-root relative
        shell: bash
        run: |
          lcov=reports/frontend/coverage/lcov.info
          if [ ! -f "$lcov" ]; then
            echo "Expected coverage report at $lcov, but it was not produced."
            exit 1
          fi
          sed -i 's|^SF:src/|SF:frontend/src/|' "$lcov"
          if ! grep -q '^SF:frontend/src/' "$lcov"; then
            echo "No SF: entries resolve under frontend/src — refusing to publish a report Sonar will read as 0%."
            grep -m5 '^SF:' "$lcov" || true
            exit 1
          fi
          echo "Rewrote $(grep -c '^SF:frontend/src/' "$lcov") source paths."
      - name: Upload vitest coverage for SonarQube
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: reports/frontend/coverage/lcov.info

  sonarqube-scan:
    name: SonarQube Scan (Code Quality)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Sonar token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Missing required secret: SONAR_TOKEN"
            echo "For SonarCloud, create a token in SonarCloud and store it in GitHub Actions secret SONAR_TOKEN."
            exit 1
          fi
      - name: Download pytest coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: backend-coverage
          path: backend
      - name: Download vitest coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-coverage
          path: reports/frontend/coverage
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v7
        with:
          # sonar.verbose is temporary. The engine is currently dying while Spring
          # builds its context — the chain ends at ArchitectureAnalysisContextAdapter
          # -> Analysis, and the default log truncates the cause. Verbose prints the
          # full `Caused by:` chain. Remove it once the root cause is known.
          args: >
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Wait for SonarCloud to finish processing
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: https://sonarcloud.io
        run: |
          # The scanner writes the Compute Engine task id here. Polling it is exact;
          # the fixed `sleep 30` this replaces raced SonarCloud's async processing,
          # so the export below could capture the *previous* analysis.
          task_file=$(find . -name report-task.txt -path '*scannerwork*' | head -1)
          if [ -z "$task_file" ]; then
            echo "No report-task.txt found — the scanner did not publish a report."
            exit 1
          fi
          ce_task_id=$(grep '^ceTaskId=' "$task_file" | cut -d= -f2)
          echo "Waiting on analysis task $ce_task_id"
          for _ in $(seq 1 60); do
            status=$(curl -s -u "$SONAR_TOKEN:" \
              "$SONAR_HOST/api/ce/task?id=$ce_task_id" \
              | grep -o '"status":"[A-Z]*"' | head -1 | cut -d'"' -f4)
            echo "  status: ${status:-unknown}"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CANCELED) echo "Analysis $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out after 5 minutes waiting for analysis."
          exit 1
      - name: Export Sonar results to files
        if: always()
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST: https://sonarcloud.io
          SONAR_PROJECT: gozq-git_EyeCanHelp-Buddy
          # Results are stored per branch, or per pull request for PR analyses.
          # Without this selector the queries silently fell back to the main branch,
          # so the exported report showed main's last analysis no matter which
          # branch had just been scanned.
          SONAR_SCOPE: ${{ github.event_name == 'pull_request' && format('pullRequest={0}', github.event.pull_request.number) || format('branch={0}', github.ref_name) }}
        run: |
          echo "Reporting scope: $SONAR_SCOPE"
          echo "Fetching open issues..."
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST/api/issues/search?componentKeys=$SONAR_PROJECT&resolved=false&ps=500&$SONAR_SCOPE" \
            -o sonar-issues.json
          echo "Fetching security hotspots..."
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST/api/hotspots/search?projectKey=$SONAR_PROJECT&ps=500&$SONAR_SCOPE" \
            -o sonar-hotspots.json
          echo "Fetching quality gate status..."
          curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST/api/qualitygates/project_status?projectKey=$SONAR_PROJECT&$SONAR_SCOPE" \
            -o sonar-quality-gate.json
          echo "=== Summary ==="
          echo "Issues:   $(grep -o '"total":[0-9]*' sonar-issues.json | head -1)"
          echo "Hotspots: $(grep -o '"total":[0-9]*' sonar-hotspots.json | head -1)"
      - name: Upload Sonar report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sonar-report
          path: |
            sonar-issues.json
            sonar-hotspots.json
            sonar-quality-gate.json

