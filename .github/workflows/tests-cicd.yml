name: Tests and Artifacts

# Runs the full test pyramid (unit, integration, E2E, load) and publishes every
# HTML report as a downloadable workflow artifact. Does not deploy anything.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit + integration (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          python -m pytest \
            --cov=services --cov=agents --cov=database \
            --cov-report=term-missing \
            --cov-report=html:../reports/backend/coverage \
            --html=../reports/backend/report.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-report
          path: reports/backend

  frontend-tests:
    name: Frontend component tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: reports/frontend

  e2e-tests:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to 20: Playwright 1.49.1 (see e2e/package.json) and the Vite
          # dev server predate Node 24; on Node 24 the browser-served app hangs
          # and the step times out. Node 20 is the version the app is built on.
          node-version: 20
      - name: Install frontend deps
        working-directory: frontend
        # npm ci can fail here when npm resolves optional peer trees differently
        # across Node/npm versions (e.g., esbuild 0.28 optional platform packages).
        # For the e2e job we only need a working local dev server, so use install.
        run: npm install --no-audit --no-fund
      - name: Install E2E deps + browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright (starts Vite via webServer)
        working-directory: e2e
        timeout-minutes: 5 # Force fails the step if it hangs
        # Exclude @integration specs: they require a real backend on :8000, which
        # this job does not start (the mocked specs stub /api/** at the network layer).
        run: npx playwright test --grep-invert "@integration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/e2e

  load-test:
    name: Stress / load (Locust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Start backend
        run: |
          # Load test only exercises GET /; disable lifespan startup hooks so
          # Postgres/Mongo availability does not affect this CI job.
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --lifespan off &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ && break; sleep 1; done
      - name: Run Locust (headless)
        run: |
          mkdir -p ../reports/load
          python -m locust -f tests/load/locustfile.py \
            --host http://127.0.0.1:8000 \
            --headless -u 50 -r 10 -t 30s \
            --html ../reports/load/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: reports/load
