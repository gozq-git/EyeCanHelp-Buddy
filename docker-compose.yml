services:
  postgres:
    image: postgres:15-alpine
    container_name: eyecanhelp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyecanhelpbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyecanhelpbuddy"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eyecanhelp-backend
    env_file:
      - ./backend/.env
    environment:
      AGENTCORE_COORDINATOR_ENDPOINT: http://coordinator:8080/invocations
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eyecanhelpbuddy
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eyecanhelp-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  # Static server for the generated test artifacts (coverage, pytest, Playwright,
  # Locust). Generate the reports first with `scripts/run-all-tests.sh`, then:
  #   docker compose up reports   →   open http://localhost:8088
  reports:
    image: nginx:1.27-alpine
    container_name: eyecanhelp-reports
    volumes:
      - ./reports:/usr/share/nginx/html:ro
      - ./reports/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"

volumes:
  postgres_data:
