sonar.projectKey=gozq-git_EyeCanHelp-Buddy
sonar.organization=gozq-git

# Coverage reports. Paths are relative to this file. Replace "\" by "/" on Windows.
# The Python report path is passed on the scanner command line by
# ".github/workflows/backend-cicd full.yml"; the JS one is written by
# `npm run test:coverage` (vitest coverage.reportsDirectory).
sonar.javascript.lcov.reportPaths=./reports/frontend/coverage/lcov.info

sonar.sources=./backend/services/,./backend/agents/,./backend/database/,./frontend/src/
sonar.tests=./backend/tests/,./frontend/src/__tests__/

# frontend/src/__tests__ sits inside the source root above, so it has to be
# excluded from sources or the scanner sees the same files twice.
sonar.exclusions=frontend/src/__tests__/**

# Entry point only — vitest excludes it from coverage too, so counting it would
# report an uncoverable 0%.
sonar.coverage.exclusions=frontend/src/main.jsx

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
