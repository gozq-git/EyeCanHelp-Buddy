# Fully-resolved dependency lock for the coordinator image (Sonar docker:S8544).
#
# requirements.txt states intent (loose ranges); this file pins every transitive
# version AND its wheel hash, so the image builds reproducibly and a compromised
# index cannot serve a different artifact for a version we already trust. The
# Dockerfile installs from here with --require-hashes, which is what S8544 asks for:
# exact pins alone still let pip accept any artifact claiming that version.
#
# Two hashes per package where the wheel is platform-specific: linux/arm64 (what
# agents-cicd.yml builds via `docker buildx build --platform linux/arm64`) and
# linux/amd64 (native local builds). pip accepts a requirement if ANY listed hash
# matches, so both platforms build from this one file. Pure-python wheels have one.
#
# Regenerate after editing requirements.txt. Resolve for each platform, then merge:
#   for plat in aarch64 x86_64; do
#     pip install --dry-run --report r-$plat.json --ignore-installed --only-binary=:all: \
#       --platform manylinux2014_$plat --platform manylinux_2_17_$plat --platform any \
#       --python-version 3.12 --implementation cp --abi cp312 --target /tmp/$plat \
#       -r requirements.lock
#   done
# then emit `name==version` followed by one `--hash=sha256:...` line per unique hash.
# Resolve against requirements.lock to refresh hashes without moving versions, or
# against requirements.txt to deliberately take upstream updates.
#
# NOTE: bedrock-agentcore resolves to 0.1.0 (not 1.x) because boto3 is pinned to
# 1.39.0 in requirements.txt; lifting that pin moves it to 1.22.0. Recorded, not
# changed - see the CI notes.

