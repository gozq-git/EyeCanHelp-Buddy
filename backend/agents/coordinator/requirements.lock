# Fully-resolved dependency lock for the coordinator image (Sonar docker:S8544).
#
# requirements.txt states intent (loose ranges); this file pins every transitive
# version so the image builds reproducibly. The Dockerfile installs from here.
#
# Resolved for the image's target platform - linux/arm64, CPython 3.12, wheels only -
# because agents-cicd.yml builds with `docker buildx build --platform linux/arm64`.
#
# Regenerate after editing requirements.txt:
#   pip install --dry-run --report r.json --ignore-installed --only-binary=:all: \
#     --platform manylinux2014_aarch64 --platform manylinux_2_17_aarch64 --platform any \
#     --python-version 3.12 --implementation cp --abi cp312 --target /tmp/x \
#     -r requirements.txt
#   python -c "import json;d=json.load(open('r.json'));[print(f\"{i['metadata']['name'].lower()}=={i['metadata']['version']}\") for i in sorted(d['install'],key=lambda x:x['metadata']['name'].lower())]"
#
# NOTE: bedrock-agentcore resolves to 0.1.0 (not 1.x) because boto3 is pinned to
# 1.39.0 in requirements.txt; lifting that pin moves it to 1.22.0. Recorded, not
# changed - see the CI notes.
